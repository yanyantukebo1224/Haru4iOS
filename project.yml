name: Haru4iOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
targets:
  Haru4iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Haru4iOS
        excludes:
          - Info.plist
          - Haru4iOS-Bridging-Header.h
    dependencies:
      - framework: Frameworks/SpeechCpp.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.haru4ios.app
        INFOPLIST_FILE: Sources/Haru4iOS/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Haru4iOS/Haru4iOS-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.9"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_ENABLE_MODULES: YES
schemes:
  Haru4iOS:
    build:
      targets:
        Haru4iOS: all
    run:
      config: Debug
